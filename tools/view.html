AAAAAAAAA////////////////////////////////////AAAAAAAAAAAA////////////////AAAAAAAAAAAAAAAAAAAAAAAAAAAA////////////////////////////////////AAAA////////////AAAA////////////AAAAAAAAAAAAAAAAAAAA////////////////////////////////////////////AAAA////////////AAAA////////////AAAAAAAAAAAA////////////////////////////////////////////////////AAAAAAAAAAAAAAAAAAAA////////////////////////////////////////////////////////////////);

<body>
<div>
<h1 style="color:blue">PacoMouseCYD Automation Viewer</h1>
</div>
<div>
<table id="searchbar" cellspacing='0' cellpadding='10'>

</table>
</div>
<div>
<table id="opcodes" cellspacing='0' cellpadding='10'>

</table>
</div>

<script type="text/javascript">
var pos;
var opcode;
var param;
var length;
var numOpc;
var value;



let params = new URLSearchParams(document.location.search);

let automation = params.get("automation");

showAutomation();


function showAutomation() {
  var searchTable = document.getElementById("searchbar");
  var opcTable = document.getElementById("opcodes");
  var row = searchTable.insertRow(0);
  var cell = row.insertCell(0);
  if (automation) {
    cell.innerHTML = 'Parameters = ' + automation + '<br><hr>';
	row = opcTable.insertRow(0);
	pos = 0;
	numOpc = 0;
	length = automation.indexOf('X');
	
	while (pos < length) {
	  cell = row.insertCell(numOpc);
      getOpcode();
	  switch (opcode) {
	  case "t":
	    cell.innerHTML = '<img class="red"><br>' + value;
	    break;
	  case "T":
	    cell.innerHTML = '<img class="green"><br>' + value;
	    break;
	  case "f":
	    cell.innerHTML = '<img class="free"><br>' + value;
	    break;
	  case "F":
	    cell.innerHTML = '<img class="busy"><br>' + value;
	    break;
	  case "L":
	    cell.innerHTML = '<img class="loco"><br>' + value;
	    break;
	  case "S":
	    cell.innerHTML = '<img class="speed"><br>' + value;
		break;
	  case "l":
	    switch (value) {
		case "0":
		  cell.innerHTML = '<img class="rev"><br>&#8203;';
		  break;
		case "1":
		  cell.innerHTML = '<img class="fwd"><br>&#8203;';
		  break;
		case "2":
		  cell.innerHTML = '<img class="change"><br>&#8203;';
		  break;
		case "3":
		  cell.innerHTML = '<img class="estop"><br>&#8203;';
		  break;
		}
	    break;
	  case "D":
	    cell.innerHTML = '<img class="time"><br>' + (parseInt(value)/10) + 's';
		break;
      case "R":
	    cell.innerHTML = '<img class="jump"><br>' + value;
		break;
      case "C":
	    cell.innerHTML = '<img class="call"><br>' + value;
		break;
      case "r":
	    cell.innerHTML = '<img class="loop"><br>&#8203;';
		break;
	  case "H":
	    cell.innerHTML = '<img class="clock"><br>' + (parseInt(value)/100);
		break;
	  case "M":
	    cell.innerHTML = '<img class="min"><br>--:' + value;
		break;
	  }
  
	  numOpc++;
	}
	
	cell = row.insertCell(numOpc);
	cell.innerHTML = '<img class="end"><br>&#8203;';
  }
  else {
    cell.innerHTML = 'No parameters found<br><br>Use: <h2>view.html?automation=</h2> followed with the automation string:<br><br>view.html?automation="T2t5X"';
  }
}


function getOpcode () {
  switch(automation[pos]) {
    case "t":
	case "T":
	case "f":
	case "F":
	case "L":
	case "S":
	case "l":
	case "D":
	case "R":
	case "C":
	case "H":
	case "M":
	  opcode = automation[pos];
	  pos++;
	  getOpcodeParameter();
	  break;
	case 'r':
  	  opcode = automation[pos];
	  pos++;
	  break;
	default:
	  opcode=" ";
	  pos++;
	  break;
  }
}


function getOpcodeParameter() {
 var chr;
 value = "";
 chr =  automation[pos];
 while (chr >="0" && chr <="9") {
   value = value + chr;
   pos++;
   chr =  automation[pos];
   }
}


</script>
 
</body>
</html>
