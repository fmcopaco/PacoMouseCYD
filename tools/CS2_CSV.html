<html>

<!DOCTYPE html> 
<html lang="en">
<head><meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>PacoMouseCYD .CS2 to .csv converter</title>
<style>

.preview-box { margin-top: 20px; background: #222; color: #eee; padding: 10px; border-radius: 4px; font-family: monospace; font-size: 11px; max-height: 150px; overflow-y: auto; display: block; }
</style>
</head>
<body>

<div><h2>lokomotive.cs2 to PacoMouseCYD .csv converter</h2></div>
<br>
<hr>
<div>Select <b>lokomotive.cs2</b> file:<input type="file" id="fileToLoad" class="texttxt">
<br>
<br>
<button class="buttontxt" onclick="loadFileAsText()">Cargar ...</button></div>
<hr>
<div class="preview-box" id="previewBox">Parsing output...</div>
<br>
<br>
<div><textarea id="inputTextToSave" style="width:100%;" rows="10">.csv output...</textarea></div>
<br>
<br>
<div><button id="saveFile" style="font-size: 30px;padding: 20px 30px; display:none" onclick="saveTextAsFile();">Save .csv</button></div>

<script type="text/javascript">
//let csvOutputContent = "";


// Check for Web Browser API support.
if (window.File && window.FileReader && window.FileList && window.Blob) {
} else {
  alert("File APIs are not fully supported in this browser.");
}

function loadFileAsText()
{
    var fileToLoad = document.getElementById("fileToLoad").files[0];
	const previewBox = document.getElementById('previewBox');
	 
    var fileReader = new FileReader();
    fileReader.onload = function(fileLoadedEvent) 
    {
        var textFromFileLoaded = fileLoadedEvent.target.result;
        previewBox.innerHTML = textFromFileLoaded;
    };
	fileReader.onloadend = function(progressEvent) 
	{
	    parseCS2();
	};
    fileReader.readAsText(fileToLoad, "UTF-8");  
}


function parseCS2() {
    const previewBox = document.getElementById('previewBox');
    var text = previewBox.innerHTML;
    var lines = text.split(/\r?\n/);
	let csvRows = [["Address", "Name", "Image", "Vmax", 
	                "F0", "F1", "F2", "F3", "F4", "F5", "F6", "F7", "F8", "F9",  
					"F10", "F11", "F12", "F13", "F14", "F15", "F16", "F17", "F18", "F19", 
					"F20", "F21", "F22", "F23", "F24", "F25", "F26", "F27", "F28", 
					"Protocol", "Moment."]];
    let currentLoco = null;
	var isFunction = false;
	var currFunction;
	var currIcon;
	var currDauer;
	var currWert;
	var momentFunc = 0;
	for (let i = 0; i < lines.length; i++) {
        let line = lines[i].trim();
        if (line == "lokomotive") {
            if (currentLoco && currentLoco.name) {
				if (isFunction) {				// funcion anterior
					let key = "F" + currFunction;
					let value = currIcon;
					currentLoco[key] = value;
					if ((currDauer != 0) && (currFunction < 29)) {
						momentFunc = momentFunc + (1 << currFunction);
						}
					}
                pushLoco(csvRows, currentLoco, momentFunc);
            }
            currentLoco = {}; // Inicializa nuevo mapa de propiedades
			isFunction = false;
			momentFunc = 0;
            continue;
            }
			
		if (currentLoco && line.startsWith(".funktionen")) {
			if (isFunction) {				// funcion anterior
			    let key = "F" + currFunction;
				let value = currIcon;
				currentLoco[key] = value;
				}
			isFunction = true;
			currIcon = 50;
			currDauer = 0;
			currWert = 0;
			}
		if (isFunction && line.startsWith("..nr")) {
			let eqIdx = line.indexOf('=');
			if (eqIdx !== -1) {
				currFunction = line.substring(eqIdx + 1).trim();
				}
			continue;
			 }
		if (isFunction && line.startsWith("..typ")) {
			let eqIdx = line.indexOf('=');
			if (eqIdx !== -1) {
				currIcon = line.substring(eqIdx + 1).trim();
				}
			continue;
			 }
		if (isFunction && line.startsWith("..dauer")) {
			let eqIdx = line.indexOf('=');
			if (eqIdx !== -1) {
				currDauer = line.substring(eqIdx + 1).trim();
				if ((currDauer != 0) && (currFunction < 29)) {
					momentFunc = momentFunc + (1 << currFunction);
					}
				}
			continue;
			 }
		if (isFunction && line.startsWith("..wert")) {
			let eqIdx = line.indexOf('=');
			if (eqIdx !== -1) {
				currWert = line.substring(eqIdx + 1).trim();
				}
			continue;
			 }
		// Captura flexible eliminando puntos iniciales y espacios crudos de la CS2
        if (currentLoco && line.startsWith('.')) {
            let eqIdx = line.indexOf('=');
            if (eqIdx !== -1) {
                let key = line.substring(1, eqIdx).trim();
                let value = line.substring(eqIdx + 1).trim();
                currentLoco[key] = value;
                }
            }
	}
	// Guardar última locomotora del bloque del archivo
    if (currentLoco && currentLoco.name) {
		if (isFunction) {				// funcion anterior
			let key = "F" + currFunction;
			let value = currIcon;
			currentLoco[key] = value;
			if ((currDauer != 0) && (currFunction < 29)) {
				momentFunc = momentFunc + (1 << currFunction);
				}
			}
        pushLoco(csvRows, currentLoco, momentFunc);
    }
	// Mostrar una pequeña vista previa del contenido que se va a descargar
    previewBox.innerText = csvRows;
	generateCSV(csvRows);
	
	var saveCSV = document.getElementById('saveFile');
	saveCSV.style.display = 'block';
	//saveTextAsFile();
}


function pushLoco(rows, loco, moment) {
    let name = loco.name;
    let address = loco.adresse;
    let typ = (loco.typ).toLowerCase();
	let imageUID = "0";
	let protocol = "0";     // DCC por defecto
    let uid = loco.uid;
	let vmax = loco.vmax;
	let symbol = loco.symbol;
	let f0  = loco.F0;
	let f1  = loco.F1;
	let f2  = loco.F2;
	let f3  = loco.F3;
	let f4  = loco.F4;
	let f5  = loco.F5;
	let f6  = loco.F6;
	let f7  = loco.F7;
	let f8  = loco.F8;
	let f9  = loco.F9;
	let f10 = loco.F10;
	let f11 = loco.F11;
	let f12 = loco.F12;
	let f13 = loco.F13;
	let f14 = loco.F14;
	let f15 = loco.F15;
	let f16 = loco.F16;
	let f17 = loco.F17;
	let f18 = loco.F18;
	let f19 = loco.F19;
	let f20 = loco.F20;
	let f21 = loco.F21;
	let f22 = loco.F22;
	let f23 = loco.F23;
	let f24 = loco.F24;
	let f25 = loco.F25;
	let f26 = loco.F26;
	let f27 = loco.F27;
	let f28 = loco.F28;
	
	let x = address.indexOf('x');
	if (x != -1)
	    address = parseInt(address.substring(x + 1).trim(), 16);
	if (typ.includes("mfx")) {
	    protocol = "2";
        let x = uid.indexOf('x');
	    if (x != -1)
	        imageUID = parseInt(uid.substring(x + 1).trim(),16);
	} else 	if (typ.includes("mm") || typ.includes("motorola")) {
				protocol = "1";
				if (loco.symbol) {
					if (loco.symbol == 2)
						imageUID = "5";
					if (loco.symbol == 1)
						imageUID = "6";
					if (loco.symbol == 0)
						imageUID = "1";
					}
			} 	else {
					if (loco.symbol) {
						if (loco.symbol == 2)
							imageUID = "5";
						if (loco.symbol == 1)
							imageUID = "6";
						if (loco.symbol == 0)
							imageUID = "1";
					}
				}
    rows.push([address, name, imageUID, vmax, f0, f1, f2, f3, f4, f5, f6, f7, f8, f9, f10, f11, f12, f13, f14, f15, f16, f17, f18, f19, f20, f21, f22, f23, f24, f25, f26, f27, f28, protocol, moment]);
}

function generateCSV(rows) {
let IconCs2PM = [
				1,3,4,2,14,6,13,12,9,11,16,30,17,15,2,2,  	// 15
				2,2,2,2,23,2,2,6,2,6,20,18,18,19,19,35,  	// 31 
				4,37,37,37,2,32,22,7,2,43,44,26,6,6,2,5,  	// 47
				38,34,  2,2,2,2,2,2,2,2,2,2,2,2,2,2,  		// 63 Fx
				2,2,2,2,2,2,2,2,2,2,2,2,2,2,2,2,			// 79
				2,2,  11,11,13,13,14,14,2,19,24,34,2,2,2,2,	// 95
				2,2,2,2,2,13,10,25,6,44,33,8,36,39,2,2,		// 111
				2,2,2,2,2,2,2,2,2,2,2,2,2,2,2,2,			// 127
				2,2,2,2,2,6,2,2,2,2,16,17,2,15,2,2,			// 143
				2,2,2,2,23,2,2,2,2,2,40,2,2,42,2,2,    		// 159
				42,13,2,2,2,45,45,2,2,2,2,2,2,2,2,2,		// 175
				2,2,2,2,2,2,2,2,2,2,2,2,2,2,2,2,			// 191
				2,2,2,2,2,2,2,2,2,2,2,2,2,2,2,2,			// 207
				2,2,2,2,2,2,2,2,2,2,2,2,2,2,2,2,			// 223
				2,2,2,2,2,2,2,2,2,2,2,2,2,2,2,2,			// 239
				2,2,2,2,2,2,2,2,2,2,2,2,2,2,2,2,]; 			// 255
var textToSave = document.getElementById("inputTextToSave");
var textCSV = "Address;Name;Image;Vmax;F0;F1;F2;F3;F4;F5;F6;F7;F8;F9;F10;F11;F12;F13;F14;F15;F16;F17;F18;F19;F20;F21;F22;F23;F24;F25;F26;F27;F28;Protocol;Moment.\n";
var numIcon;

for (let i = 1; i < rows.length; i++) {
	textCSV = textCSV + rows[i][0] + ";";			// address
	textCSV = textCSV + rows[i][1] + ";";			// name
	textCSV = textCSV + rows[i][2] + ";";			// image
	if (rows[i][3]) 
		textCSV = textCSV + rows[i][3] + ";";		// vmax
	else
		textCSV = textCSV + "100;";
    for (let j = 0; j < 29; j++) {					// functions F0..F28
		if (rows[i][j]) {
			numIcon = rows[i][j];
			if (numIcon < 256)
				numIcon = IconCs2PM[numIcon];
			else
				numIcon = 2;
			textCSV = textCSV + numIcon + ";";
			}
		else
			textCSV = textCSV + "1;";
		}
	textCSV = textCSV + rows[i][33] + ";";			// protocol
	textCSV = textCSV + rows[i][34] + "\n";			// momentary
    }
	textToSave.value = textCSV;
}


function saveTextAsFile()
{
    var textToSave = document.getElementById("inputTextToSave").value;
    var textToSaveAsBlob = new Blob([textToSave], {type:"text/plain"});
    var textToSaveAsURL = window.URL.createObjectURL(textToSaveAsBlob);
    var fileNameToSaveAs = "PacoMouseCYD";
	fileNameToSaveAs = fileNameToSaveAs + ".csv";
 
    var downloadLink = document.createElement("a");
    downloadLink.download = fileNameToSaveAs;
    downloadLink.innerHTML = "Download File";
    downloadLink.href = textToSaveAsURL;
    downloadLink.onclick = destroyClickedElement;
    downloadLink.style.display = "none";
    document.body.appendChild(downloadLink);
 
    downloadLink.click();
}
 
function destroyClickedElement(event)
{
    document.body.removeChild(event.target);
}


</script>
 
</body>
</html>
